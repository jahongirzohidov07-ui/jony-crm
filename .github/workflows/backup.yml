# KUNLIK BAZA ZAXIRASI (2026-08-12, Jahongir: "baza zaxirasi... shuni
# hal qil"). Har kuni Toshkent vaqti bilan ~04:00 da butun Postgres
# bazadan pg_dump olinadi va GitHub artefakt sifatida saqlanadi.
#
# FAQAT ENG OXIRGI NUSXA SAQLANADI (2026-09-13, Jahongir: "pul
# ketmasligi kerak"). Bepul GitHub hisobida artefaktlar uchun 500 MB
# joy bor, kvota tugasa yuklash BLOKLANADI. Siqilgan nusxa 264 MB,
# eski sozlama esa 30 kunlik + 90 kunlik haftalik nusxa to'plab ~8 GB
# qilardi — 2-3 kunda to'xtab qolardi. Endi: yangi nusxa yuklanadi,
# keyin eskilari o'chiriladi (hech qachon nusxasiz qolinmaydi).
# Uzoqroq orqaga qaytish uchun Neon'ning o'z "Instant restore"i bor.
#
# ISHLASHI UCHUN BIR MARTALIK SOZLASH KERAK:
#   GitHub repo -> Settings -> Secrets and variables -> Actions ->
#   New repository secret -> nomi: DATABASE_URL, qiymati: Vercel'dagi
#   DATABASE_URL (Vercel -> jony-crm -> Settings -> Environment
#   Variables ichidan nusxa olinadi).
# Tiklash: artefaktni yuklab olib: gunzip -c jonyos_*.sql.gz | psql "$DATABASE_URL"
name: DB Backup
on:
  schedule:
    - cron: "0 23 * * *"   # 23:00 UTC = 04:00 Toshkent
  workflow_dispatch:

permissions:
  actions: write     # eski artefaktlarni o'chirish uchun
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        env:
          DB: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DB" ]; then
            echo "::error::DATABASE_URL sekreti qo'shilmagan! Settings -> Secrets -> Actions -> New repository secret (nomi: DATABASE_URL)."
            exit 1
          fi
      - name: Install pg_dump 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add - 2>/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      # Qaysi jadval qancha joy egallayotgani. Faqat NOM va HAJM chiqadi —
      # hech qanday shaxsiy ma'lumot logga tushmaydi. Yiqilsa ham zaxira
      # to'xtamaydi.
      - name: Jadval hajmlari
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          PSQL=/usr/lib/postgresql/17/bin/psql
          $PSQL "$DATABASE_URL" -X -P footer=off -c "SELECT pg_size_pretty(pg_database_size(current_database())) AS baza_jami"
          $PSQL "$DATABASE_URL" -X -P footer=off -c "
            SELECT c.relname AS jadval,
                   pg_size_pretty(pg_total_relation_size(c.oid)) AS hajm,
                   c.reltuples::bigint AS taxminiy_qator
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE c.relkind = 'r' AND n.nspname = 'public'
            ORDER BY pg_total_relation_size(c.oid) DESC
            LIMIT 25"
          # practice_items — tayyor mashqlar banki. Kod ~3 ming qator
          # yaratadi, bazada esa 1,28 mln bor. Tur bo'yicha jami va NOYOB
          # soni: farq = dublikat. Faqat tur nomlari va sonlar chiqadi.
          $PSQL "$DATABASE_URL" -X -P footer=off -c "
            SELECT skill, kind, count(*) AS jami,
                   count(DISTINCT md5(payload || '|' || answer)) AS noyob,
                   pg_size_pretty(sum(pg_column_size(payload) + pg_column_size(answer)
                     + coalesce(pg_column_size(alt),0) + coalesce(pg_column_size(explain),0))::bigint) AS hajm,
                   min(id) AS birinchi_id, max(id) AS oxirgi_id
            FROM practice_items
            GROUP BY skill, kind
            ORDER BY count(*) DESC
            LIMIT 40"
      - name: Dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-privileges \
            --format=plain "$DATABASE_URL" | gzip > "jonyos_${STAMP}.sql.gz"
          ls -lh jonyos_*.sql.gz
          # bo'sh dump = xato (baza ulanmagan bo'lishi mumkin)
          [ $(stat -c%s jonyos_${STAMP}.sql.gz) -gt 10000 ] || { echo "::error::Dump juda kichik!"; exit 1; }
      # retention-days: 2 — o'chirish qadami biror sabab bilan ishlamasa
      # ham nusxalar to'planib qolmasin (ehtiyot chorasi).
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: jonyos-db-daily-${{ github.run_id }}
          path: jonyos_*.sql.gz
          retention-days: 2
      # Yangi nusxa YUKLANGANDAN KEYIN eskilari o'chiriladi — shunda
      # hech qachon nusxasiz qolinmaydi.
      - name: Eski nusxalarni o'chirish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/$REPO/actions/artifacts?per_page=100" --paginate \
            --jq ".artifacts[] | select(.name | startswith(\"jonyos-db-\")) | select(.workflow_run.id != $RUN_ID) | .id" |
          while read -r id; do
            [ -n "$id" ] || continue
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && echo "o'chirildi: $id"
          done
          echo "--- qolgan nusxalar ---"
          gh api "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("jonyos-db-")) | "\(.name)  \(.size_in_bytes/1048576|floor) MB"'
