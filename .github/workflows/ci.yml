# Har push'da avtomatik tekshiruv: backend testlar + frontend build.
# Bu yashil bo'lmasa — Vercel'dagi build ham katta ehtimol yiqiladi.
name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Student reward guidance tests
        working-directory: api
        run: python test_student_reward_path.py
      - name: Import smoke test (api/)
        working-directory: api
        env:
          DATABASE_URL: "sqlite:////tmp/ci_smoke.db"
        run: |
          python -c "import main; print('main.py import OK')"
          python -c "import roles, models, schemas, billing, audit, notify, migrations; print('modules OK')"
      # SXEMA QO'RIQCHISI — har push'da, [deploy] bo'lmasa ham.
      # 28-avgust va 10-sentabrdagi avariyalar ikkalasi ham
      # "modelga ustun qo'shdim, jonli bazada paydo bo'lmadi"
      # sababidan edi. Shu qadam qizil bo'lsa — deploy qilmaymiz.
      - name: Schema guard (hamma jadval va ustun)
        working-directory: api
        env:
          DATABASE_URL: "sqlite:////tmp/ci_schema.db"
        run: python test_schema_all_tables.py
      - name: Schema stamp guard
        working-directory: api
        env:
          DATABASE_URL: "sqlite:////tmp/ci_stamp.db"
        run: |
          if [ -f test_schema_stamp.py ]; then python test_schema_stamp.py; fi
      - name: Student course practice isolation and grading
        working-directory: api
        run: |
          python test_student_identity.py
          python test_student_course_practice.py
          python test_course_motivation.py
          python test_student_daily_six.py
          python test_course_learning_evidence.py
          python test_course_plan_measurement.py
          python test_course_session_summary.py
          python test_course_weekly_missions.py
          python test_course_portfolio.py
          python test_course_feedback.py
          python test_course_pace.py
          python test_course_collaboration.py
          python test_course_checkpoint_data.py
          python test_course_themes.py
      - name: Guard tests
        working-directory: api
        env:
          DATABASE_URL: "sqlite:////tmp/ci_guard.db"
        run: |
          if [ -f test_account.py ]; then python test_account.py; fi
          # Kuzatuvchi hech qanday yozish so'rovini o'tkaza olmasligi
          python test_observer.py
      - name: Rolling suite
        working-directory: api
        env:
          DATABASE_URL: "sqlite:////tmp/ci_plan.db"
        run: |
          if [ -f test_plan.py ]; then python test_plan.py; fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Export student course practice bank
        run: node scripts/export-student-course-practice.cjs
      - name: Android speech bridge regression tests
        run: node scripts/test-native-bridge.cjs
      - name: Focused study time regressions
        run: node scripts/test-course-active-time.cjs
      - name: Course question interaction tests
        run: node --test scripts/test-course-question-interaction.cjs
      - name: Weekly life mission tests
        run: node --test scripts/test-course-missions.cjs
      - name: Contextual practice choice tests
        run: node --test scripts/test-course-practice-choice.cjs
      - name: Student ranking and reward guidance
        run: node --test scripts/test-student-leaderboard.cjs scripts/test-student-reward-goal.cjs scripts/test-student-reward-path.cjs scripts/test-student-reward-practice.cjs scripts/test-student-reward-context.cjs
      - name: Daily six skills tests
        run: node --test scripts/test-course-daily-six.cjs
      - name: Student regression tests
        run: node --test scripts/test-student-regressions.cjs
      - name: Intensive curriculum and exercise checks
        run: node --test scripts/test-intensive.cjs
      - name: English and German teacher kits and lesson audio
        run: node --test scripts/test-intensive-teaching.cjs scripts/test-german.cjs scripts/test-german-teaching.cjs scripts/test-course-audio.cjs scripts/test-intensive-skills-extension.cjs
      - name: Type check (Vercel bilan bir xil)
        run: npx tsc -b
      - name: Build
        run: npx vite build

  full-suite:
    # To'liq test to'plami faqat [deploy] commitlarda - minutlarni
    # tejash uchun (oddiy pushda smoke + 2 test yetadi).
    if: contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run ALL api tests
        working-directory: api
        run: |
          set -e
          for f in test_*.py; do
            echo "=== $f ==="
            DATABASE_URL="sqlite:////tmp/ci_$f.db" timeout 240 python "$f"
          done
