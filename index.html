<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iPhone (2026-08-10, Jahongir): "har yo'qlama qilgandan keyin
         boshiga qaytib qolyabdi ... ko'proq survorsa programmadan
         chiqarib yuboryabdi".
         maximum-scale + user-scalable=no — ikki marta bosilganda
         zoom bo'lib ekran sakramasin;
         viewport-fit=cover — pastdagi tab paneli iPhone'ning
         "home indicator" chizig'i ostida qolib ketmasin. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1A6FE4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- SHRIFT (2026-10-22, Jahongir: "yozuvlar ham arzondek
         ko'rinyabdi biroz qimmat uslub"). Inter — matn, Manrope —
         sarlavha; ikkalasida kirill ham bor (ruscha interfeys). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" />
    <title>JonyOS — Jony Academy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
